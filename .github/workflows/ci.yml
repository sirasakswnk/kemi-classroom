# ตรวจหน้าเว็บทุก push/PR และรัน pgTAP เมื่อแก้ฐานข้อมูล — TECHNICAL_BUILD_PLAN ส่วน 8
# job db ใช้ Postgres ชั่วคราวใน runner เท่านั้น: ไม่ใช้ secret และไม่แตะ kemi-dev (รอบ kemi-dev อยู่ใน deploy-db.yml)
name: ci

on:
  push:
    paths-ignore: ['**.md', 'exports/**']
  pull_request:
    paths-ignore: ['**.md', 'exports/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      db: ${{ steps.changes.outputs.db }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # ตัดสินว่าต้องรัน job db หรือไม่ (ทำในนี้เพื่อไม่เสียนาทีเปิด runner แยก)
      - id: changes
        working-directory: .
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "db=true" >> "$GITHUB_OUTPUT"   # branch ใหม่หรือหา commit ฐานไม่เจอ: รันไว้ก่อน
          elif git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qE '^(supabase/|package(-lock)?\.json$|\.github/workflows/ci\.yml$)'; then
            echo "db=true" >> "$GITHUB_OUTPUT"
          else
            echo "db=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      # Edge Functions: ตรวจ type ด้วย TypeScript ของ web (ติดตั้งแพ็กเกจที่ root แบบไม่รันสคริปต์ เพื่อหา aws4fetch)
      - run: npm ci --ignore-scripts && npm run functions:typecheck
        working-directory: .
      - run: npm run build
        env:
          # ค่าสมมติเพื่อตรวจว่า build ผ่านเท่านั้น — ค่าจริงเป็นตัวแปร build ของ Cloudflare Pages
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      # CSP ใน dist/_headers ต้องถูกแทนค่าแล้วและไม่เปิด inline/eval
      - run: |
          grep -q "connect-src 'self' https://example.supabase.co;" dist/_headers
          ! grep -qE "__SUPABASE_ORIGIN__|unsafe-inline|unsafe-eval" dist/_headers

  db:
    needs: web
    # รันแม้ job web ล้ม เพื่อให้เห็นผลฐานข้อมูลแยกกัน
    if: ${{ !cancelled() && needs.web.outputs.db == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci # Supabase CLI รุ่นเดียวกับในเครื่อง
      - run: npm run functions:test # unit test ของ Edge Function (ไม่เรียก B2 จริง)
      - run: npx supabase db start # เปิดแค่ Postgres แล้วใส่ migration ของ commit นี้
      - run: npm run db:test
