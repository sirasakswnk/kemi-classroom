# สำรองข้อมูลวันละ 2 รอบ — TECHNICAL_BUILD_PLAN ส่วน 8 (ขั้นตอน backup.yml), TECHNICAL_DESIGN ส่วน 12
# P3-11: แบบพื้นฐาน · P7-08: เลือกเป้าหมาย dev/prod · P7-01: job guard + token_totals ใน meta.json (ทดสอบกู้คืน: restore-test.yml)
# ตารางเวลาทำงานเฉพาะบน branch หลัก (main)
#
# เป้าหมาย: repository variable BACKUP_TARGET (Settings → Secrets and variables → Actions → Variables) = dev | prod
#   ไม่ตั้ง = dev · สลับไป prod ครั้งเดียวที่ตัวแปรนี้ → รอบตามตารางสำรอง prod อย่างเดียว (หยุดสำรอง dev ไปในตัว)
#   รันด้วยมือเลือก target ได้ (auto = ตามตัวแปร) — ops/backup.sh ตรวจซ้ำว่า ref + bucket + โฟลเดอร์ Drive เป็นชุดเดียวกัน
#
# GitHub Secrets (ผู้ใช้ใส่เองทางหน้าเว็บ — dev: ops/backup-setup.md · prod: ops/prod-setup.md ข้อ 8):
#   dev:  BACKUP_DB_PASSWORD       RCLONE_CONFIG       HC_PING_URL       SUPABASE_PING_KEY (ไม่บังคับ)
#   prod: PROD_BACKUP_DB_PASSWORD  PROD_RCLONE_CONFIG  PROD_HC_PING_URL  PROD_SUPABASE_PING_KEY (ไม่บังคับ)
#   RCLONE_CONFIG = เนื้อไฟล์ rclone.conf (remote gdrive, gcrypt ครอบ gdrive:kemi-backup / gdrive:kemi-backup-prod, b2ro)
name: backup

on:
  schedule:
    - cron: '30 19 * * *' # 02:30 น. เวลาไทย
    - cron: '30 7 * * *' # 14:30 น. เวลาไทย
  workflow_dispatch:
    inputs:
      target:
        description: 'เป้าหมาย (auto = ตาม repository variable BACKUP_TARGET, ไม่ตั้ง = dev)'
        type: choice
        options: [auto, dev, prod]
        default: auto
      simulate_failure:
        description: 'ล้มโดยตั้งใจหลังเริ่มรอบ (ทดสอบอีเมลของ Healthchecks และการปลดล็อก)'
        type: boolean
        default: false

permissions:
  contents: read

# รันทีละรอบ ไม่ยกเลิกรอบที่กำลังทำ (ธง maintenance_locks ต้องถูกปลดโดยรอบนั้นเอง)
concurrency:
  group: backup
  cancel-in-progress: false

env:
  BACKUP_TARGET: ${{ (inputs.target && inputs.target != 'auto') && inputs.target || vars.BACKUP_TARGET || 'dev' }}
  # ค่าที่ไม่ใช่ความลับที่เหมือนกันทั้งสองเป้าหมาย (ref/bucket ต่อเป้าหมายตั้งในขั้น “ค่าของเป้าหมาย”)
  PGHOST: aws-0-ap-southeast-1.pooler.supabase.com
  PGPORT: '5432'
  PGDATABASE: postgres
  PGSSLMODE: require
  B2_S3_ENDPOINT: https://s3.eu-central-003.backblazeb2.com
  B2_REGION: eu-central-003
  PG_MAJOR: '17'
  # ห้ามตั้งชื่อขึ้นต้น RCLONE_ ที่ตรงกับแฟล็ก (rclone อ่าน RCLONE_VERSION เป็น --version)
  RCLONE_PKG_VERSION: v1.75.1
  RCLONE_PKG_SHA256: 09c9f7606ed9e31eecc1eec26a89992cf2931a8d2d1a5f0ae2bb1c11630ffb15

jobs:
  backup:
    runs-on: ubuntu-24.04
    # ต่ำกว่าอายุธง 2 ชม. มาก — รอบปกติไม่กี่นาที
    timeout-minutes: 45
    steps:
      # ref/bucket ของเป้าหมาย (ค่าเดียวกับที่ ops/backup.sh เขียนตาย) — เป้าหมายอื่นหยุดทันที
      - name: ค่าของเป้าหมาย
        run: |
          case "$BACKUP_TARGET" in
            dev) ref=igchlnmxbghsigyziomk bucket=kemi-dev-files ;;
            prod) ref=fcwbomasayvlubijsssh bucket=kemi-files ;;
            *) echo "::error::BACKUP_TARGET ต้องเป็น dev หรือ prod"; exit 1 ;;
          esac
          {
            echo "PGUSER=postgres.$ref"
            echo "B2_BUCKET=$bucket"
            echo "SUPABASE_URL=https://$ref.supabase.co"
          } >>"$GITHUB_ENV"
          echo "เป้าหมาย $BACKUP_TARGET ($ref / $bucket)"

      - name: ตรวจว่ามี secret ของเป้าหมายครบ
        env:
          DEV_DB: ${{ secrets.BACKUP_DB_PASSWORD }}
          DEV_RCLONE: ${{ secrets.RCLONE_CONFIG }}
          DEV_HC: ${{ secrets.HC_PING_URL }}
          PROD_DB: ${{ secrets.PROD_BACKUP_DB_PASSWORD }}
          PROD_RCLONE: ${{ secrets.PROD_RCLONE_CONFIG }}
          PROD_HC: ${{ secrets.PROD_HC_PING_URL }}
        run: |
          if [ "$BACKUP_TARGET" = prod ]; then
            set -- PROD_BACKUP_DB_PASSWORD "$PROD_DB" PROD_RCLONE_CONFIG "$PROD_RCLONE" PROD_HC_PING_URL "$PROD_HC"
          else
            set -- BACKUP_DB_PASSWORD "$DEV_DB" RCLONE_CONFIG "$DEV_RCLONE" HC_PING_URL "$DEV_HC"
          fi
          missing=''
          while [ $# -gt 0 ]; do [ -n "$2" ] || missing="$missing $1"; shift 2; done
          if [ -n "$missing" ]; then echo "::error::ยังไม่ได้ใส่ GitHub Secrets ($BACKUP_TARGET):$missing"; exit 1; fi

      # ข้อ 1: ping /start ก่อนทำอะไร (Healthchecks วัดเวลารอบ และรู้ว่างานเริ่มแล้ว)
      - name: ping start
        env:
          DEV_HC: ${{ secrets.HC_PING_URL }}
          PROD_HC: ${{ secrets.PROD_HC_PING_URL }}
        run: |
          if [ "$BACKUP_TARGET" = prod ]; then url=$PROD_HC; else url=$DEV_HC; fi
          curl -fsS -m 10 --retry 3 -o /dev/null "$url/start" || echo '::warning::ส่ง ping /start ไม่สำเร็จ'

      - uses: actions/checkout@v7

      # ข้อ 1: postgresql-client รุ่นหลักตรงกับเซิร์ฟเวอร์จาก PGDG + rclone รุ่นที่ตรึงไว้ (ตรวจ SHA-256)
      - name: ติดตั้ง postgresql-client และ rclone
        run: |
          pgdg=/usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          if [ ! -x "$pgdg" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-common >/dev/null; fi
          sudo "$pgdg" -y >/dev/null
          sudo apt-get install -y -qq "postgresql-client-$PG_MAJOR" >/dev/null
          curl -fsSLo "$RUNNER_TEMP/rclone.deb" "https://downloads.rclone.org/$RCLONE_PKG_VERSION/rclone-$RCLONE_PKG_VERSION-linux-amd64.deb"
          echo "$RCLONE_PKG_SHA256  $RUNNER_TEMP/rclone.deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/rclone.deb" >/dev/null
          "/usr/lib/postgresql/$PG_MAJOR/bin/pg_dump" --version
          rclone version | sed -n 1p
          aws --version

      # secret ของเป้าหมายเดียวเข้า ops/backup.sh (ชุดอื่นถูก unset ก่อนเรียกสคริปต์)
      - name: สำรองข้อมูล (ops/backup.sh)
        env:
          DEV_DB: ${{ secrets.BACKUP_DB_PASSWORD }}
          DEV_RCLONE: ${{ secrets.RCLONE_CONFIG }}
          DEV_HC: ${{ secrets.HC_PING_URL }}
          DEV_PING: ${{ secrets.SUPABASE_PING_KEY }}
          PROD_DB: ${{ secrets.PROD_BACKUP_DB_PASSWORD }}
          PROD_RCLONE: ${{ secrets.PROD_RCLONE_CONFIG }}
          PROD_HC: ${{ secrets.PROD_HC_PING_URL }}
          PROD_PING: ${{ secrets.PROD_SUPABASE_PING_KEY }}
          HC_STATE_FILE: ${{ runner.temp }}/hc-state
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
        run: |
          if [ "$BACKUP_TARGET" = prod ]; then
            export PGPASSWORD=$PROD_DB RCLONE_CONFIG_CONTENT=$PROD_RCLONE HC_PING_URL=$PROD_HC SUPABASE_PING_KEY=$PROD_PING
          else
            export PGPASSWORD=$DEV_DB RCLONE_CONFIG_CONTENT=$DEV_RCLONE HC_PING_URL=$DEV_HC SUPABASE_PING_KEY=$DEV_PING
          fi
          unset DEV_DB DEV_RCLONE DEV_HC DEV_PING PROD_DB PROD_RCLONE PROD_HC PROD_PING
          PG_BIN="/usr/lib/postgresql/$PG_MAJOR/bin" bash ops/backup.sh

      # ล้มก่อนถึงสคริปต์ (ติดตั้งไม่ผ่าน) หรือถูกยกเลิก/หมดเวลา: ส่ง /fail ถ้าสคริปต์ยังไม่ได้ส่งผล
      - name: ping fail (สำรอง)
        if: ${{ failure() || cancelled() }}
        env:
          DEV_HC: ${{ secrets.HC_PING_URL }}
          PROD_HC: ${{ secrets.PROD_HC_PING_URL }}
          HC_STATE_FILE: ${{ runner.temp }}/hc-state
        run: |
          if [ "$BACKUP_TARGET" = prod ]; then url=$PROD_HC; else url=$DEV_HC; fi
          if [ -n "$url" ] && [ ! -s "$HC_STATE_FILE" ]; then
            curl -fsS -m 10 --retry 3 -o /dev/null --data-raw "kemi-backup ($BACKUP_TARGET) ล้มนอกสคริปต์ (run ${{ github.run_id }})" "$url/fail" || true
          fi

  # BUILD_PLAN 8 “งาน guard”: prod ต้องไม่มี allow_test_logins = on — job แยก ล้มแล้ว GitHub ส่งอีเมลแต่งานสำรองทำต่อ
  # ตรวจเฉพาะรอบเป้าหมาย prod (รอบ dev ไม่อ่าน prod) · อ่านอย่างเดียวใน transaction READ ONLY
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: ข้ามเมื่อไม่ใช่เป้าหมาย prod
        if: ${{ env.BACKUP_TARGET != 'prod' }}
        run: echo "เป้าหมาย $BACKUP_TARGET — guard ตรวจเฉพาะ prod"

      - uses: actions/checkout@v7
        if: ${{ env.BACKUP_TARGET == 'prod' }}

      - name: ตรวจ allow_test_logins ของ prod (ops/guard.sh)
        if: ${{ env.BACKUP_TARGET == 'prod' }}
        env:
          PGUSER: postgres.fcwbomasayvlubijsssh
          PGPASSWORD: ${{ secrets.PROD_BACKUP_DB_PASSWORD }}
        run: |
          if [ -z "$PGPASSWORD" ]; then echo '::error::ยังไม่ได้ใส่ GitHub Secrets: PROD_BACKUP_DB_PASSWORD'; exit 1; fi
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          psql --version
          bash ops/guard.sh
